# Elmu · daily ESG data refresh
# Runs after IDX market close (5 PM WIB / 10 AM UTC), pulls fresh
# stock prices + JCI benchmark + RSS news, commits any changes.
# Netlify then auto-redeploys from the new commit.
name: Refresh ESG market data

on:
  schedule:
    - cron: '0 10 * * 1-5'   # Mon–Fri at 10:00 UTC (17:00 WIB)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    name: Pull live data and commit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance feedparser

      - name: Run data refresher
        run: python fetch_data.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet stocks.js news.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.js news.js
          git commit -m "chore: daily ESG data refresh ($(date -u +'%Y-%m-%d'))"
          git push

      - name: No-op summary
        if: steps.changes.outputs.changed == 'false'
        run: echo "No data changes today — skipping commit."
